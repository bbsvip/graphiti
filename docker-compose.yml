services:
  graph:
    profiles: [""]
    build:
      context: .
      args:
        INSTALL_LOCAL_CORE: "true"
    ports:
      - "${GRAPHITI_BIND_HOST:-127.0.0.1}:${GRAPHITI_PORT:-8000}:8000"
    volumes:
      - openai_state:/app/.openai-runtime
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - OPENAI_STATE_DIR=/app/.openai-runtime
      - LLM_PROVIDER=${LLM_PROVIDER:-oauth}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - OPENAI_CALLBACK_PORT=${GRAPHITI_PORT:-8000}
      - LOCAL_MODEL_URL=${LOCAL_MODEL_URL:-http://192.168.1.11:7997}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      - RERANKER_MODEL_NAME=${RERANKER_MODEL_NAME:-}
      - GRAPHITI_TELEMETRY_ENABLED=false
      - NEO4J_URI=bolt://neo4j:${NEO4J_PORT:-7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - PORT=8000
      - db_backend=neo4j
  neo4j:
    image: neo4j:5.26.2
    profiles: [""]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${NEO4J_PORT:-7474} || exit 1",
        ]
      interval: 1s
      timeout: 10s
      retries: 10
      start_period: 3s
    ports:
      - "7474:7474" # HTTP
      - "${NEO4J_PORT:-7687}:${NEO4J_PORT:-7687}" # Bolt
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}

  falkordb:
    image: falkordb/falkordb:latest
    profiles: ["falkordb"]
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    environment:
      - FALKORDB_ARGS=--port 6379 --cluster-enabled no
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 1s
      timeout: 10s
      retries: 10
      start_period: 3s
  graph-falkordb:
    build:
      args:
        INSTALL_FALKORDB: "true"
        INSTALL_LOCAL_CORE: "true"
      context: .
    profiles: ["falkordb"]
    ports:
      - "${GRAPHITI_BIND_HOST:-127.0.0.1}:${GRAPHITI_FALKORDB_PORT:-8001}:8000"
    volumes:
      - openai_state_falkordb:/app/.openai-runtime
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      - OPENAI_STATE_DIR=/app/.openai-runtime
      - LLM_PROVIDER=${LLM_PROVIDER:-oauth}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - OPENAI_CALLBACK_PORT=${GRAPHITI_FALKORDB_PORT:-8001}
      - LOCAL_MODEL_URL=${LOCAL_MODEL_URL:-http://192.168.1.11:7997}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      - RERANKER_MODEL_NAME=${RERANKER_MODEL_NAME:-}
      - GRAPHITI_TELEMETRY_ENABLED=false
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_DATABASE=default_db
      - GRAPHITI_BACKEND=falkordb
      - PORT=8000
      - db_backend=falkordb

volumes:
  openai_state:
  openai_state_falkordb:
  neo4j_data:
  falkordb_data:
